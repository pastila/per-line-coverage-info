# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [ prereleased, released ]

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          RELEASE_NOTE="./build/tmp/release_note.txt"
          mkdir -p "$(dirname "$RELEASE_NOTE")"
          echo "$CHANGELOG" > $RELEASE_NOTE

          ./gradlew patchChangelog --release-note-file=$RELEASE_NOTE

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      # Upload an artifact as a release asset
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*

      # Regenerate the custom plugin repository manifest (docs/updatePlugins.xml)
      # so users who added our GitHub Pages URL receive the new version automatically.
      - name: Update custom plugin repository manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          PLUGIN_VERSION="$(grep -E '^pluginVersion\s*=' gradle.properties | cut -d= -f2 | xargs)"
          SINCE_BUILD="$(grep -E '^pluginSinceBuild\s*=' gradle.properties | cut -d= -f2 | xargs)"
          UNTIL_BUILD="$(grep -E '^pluginUntilBuild\s*=' gradle.properties | cut -d= -f2 | xargs)"
          PLUGIN_NAME="$(grep -E '^pluginName\s*=' gradle.properties | cut -d= -f2 | xargs)"
          PLUGIN_ID="com.github.yakov255.perlinecoverageinfo"

          ASSET_PATH="$(ls ./build/distributions/${PLUGIN_NAME}-*.zip | head -n1)"
          ASSET_NAME="$(basename "$ASSET_PATH")"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ASSET_NAME}"

          # Escape change notes for XML (CDATA-safe).
          CHANGE_NOTES="${{ github.event.release.body }}"
          CHANGE_NOTES_ESCAPED="$(printf '%s' "$CHANGE_NOTES" | sed 's/]]>/]]]]><![CDATA[>/g')"

          mkdir -p docs
          cat > docs/updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!--
            Auto-generated by .github/workflows/release.yml on every release.
            Do not edit manually.
          -->
          <plugins>
            <plugin id="${PLUGIN_ID}"
                    url="${DOWNLOAD_URL}"
                    version="${PLUGIN_VERSION}">
              <name>${PLUGIN_NAME}</name>
              <vendor>yakov255</vendor>
              <idea-version since-build="${SINCE_BUILD}" until-build="${UNTIL_BUILD}"/>
              <description><![CDATA[Per-line coverage info plugin distributed via GitHub.]]></description>
              <change-notes><![CDATA[
          ${CHANGE_NOTES_ESCAPED}
              ]]></change-notes>
            </plugin>
          </plugins>
          EOF

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # Commit on top of main so GitHub Pages (served from main /docs) updates.
          git fetch origin main
          git checkout main
          git add docs/updatePlugins.xml
          if git diff --cached --quiet; then
            echo "updatePlugins.xml unchanged — skipping commit."
          else
            git commit -m "Update custom plugin repository manifest for ${TAG}"
            git push origin main
          fi


      # Create a pull request
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH

          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
