name: Build and Release
on:
  push:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free Disk Space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew buildPlugin
      - uses: actions/upload-artifact@v6
        with:
          name: plugin-dist
          path: build/distributions/per-line-coverage-info-*.zip

  release:
    name: Release
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Free Disk Space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v6
        with:
          name: plugin-dist
          path: build/distributions

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi
          mkdir -p build/tmp
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=build/tmp/release_note.txt
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file build/tmp/release_note.txt \
            build/distributions/per-line-coverage-info-*.zip

      - name: Update plugin repository manifest
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          ./gradlew generateUpdatePluginsXml
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/updatePlugins.xml
          if git diff --cached --quiet; then
            echo "updatePlugins.xml unchanged — skipping commit."
          else
            git commit -m "Update custom plugin repository manifest for $VERSION"
            git push origin main
          fi
