name: Build and Release
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew buildPlugin

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')

          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists, skipping"
            exit 0
          fi

          ZIP=$(ls build/distributions/per-line-coverage-info-*.zip | head -1)
          echo "Asset: $ZIP"

          mkdir -p build/tmp
          ./gradlew getChangelog --unreleased --no-header --quiet --console=plain --output-file=build/tmp/release_note.txt

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file build/tmp/release_note.txt \
            "$ZIP"

      - name: Update plugin repository manifest
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          ./gradlew generateUpdatePluginsXml
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/updatePlugins.xml
          if git diff --cached --quiet; then
            echo "updatePlugins.xml unchanged — skipping commit."
          else
            git commit -m "Update custom plugin repository manifest for $VERSION"
            git push origin main
          fi
